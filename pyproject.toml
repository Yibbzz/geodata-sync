[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodata-sync"
version = "0.1.0"
description = "Open GIS data (Ordnance Survey, CKAN portals, WFS, OGC API Features, plain links) loaded into PostGIS and kept up to date, from YAML files"
readme = "README.md"
license = { text = "BSD-2-Clause" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "requests>=2.28", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
geodata = "geodata_sync.cli:main"

[tool.setuptools]
packages = ["geodata_sync", "geodata_sync.sources"]

[tool.setuptools.package-data]
geodata_sync = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a PostGIS database (TEST_DB_* env vars) and ogr2ogr",
]
addopts = "-ra"
