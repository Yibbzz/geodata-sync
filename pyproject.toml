[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geoserver-dataops"
version = "0.3.0"
description = "The data GeoServer publishes, loaded into PostGIS and kept up to date from YAML files: ArcGIS, CKAN, STAC, Overture, OpenStreetMap, WFS, OGC API and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18", "requests>=2.28", "psycopg2-binary>=2.9"]

[project.optional-dependencies]
dev = ["pytest", "pyarrow>=14", "shapely>=2", "paramiko>=4"]
overture = ["pyarrow>=14", "shapely>=2"]  # the overture source reads GeoParquet
sftp = ["paramiko>=4"]  # files sources on SFTP servers
google = ["cryptography>=42"]  # files sources on Google Cloud Storage with a service account key

[project.scripts]
dataops = "geoserver_dataops.cli:main"

[tool.setuptools]
packages = ["geoserver_dataops", "geoserver_dataops.sources"]

[tool.setuptools.package-data]
geoserver_dataops = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a PostGIS database (TEST_DB_* env vars) and ogr2ogr",
    "e2e: needs a GeoServer and its PostGIS (tests/e2e/up.sh, E2E_* env vars) and GDAL's tools",
]
addopts = "-ra"
