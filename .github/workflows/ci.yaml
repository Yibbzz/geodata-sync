name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # the versions workflow starts it on its pull request if GitHub doesn't

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: gis
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # files sources on servers (tests/test_servers.py)
      sftp:
        image: atmoz/sftp@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372  # alpine
        env:
          SFTP_USERS: drop:dropPass123:1001::upload
        ports:
          - 52222:22
      mariadb:
        image: mariadb@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707  # 11.8
        env:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_DATABASE: assets
        ports:
          - 53306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      ftp:
        image: delfer/alpine-ftp-server@sha256:b27013e7436cea343826ba7edb77aa3a8b2d22df14e366b82d10a3b0b5ecc880
        env:
          USERS: drop|dropPass123
          ADDRESS: 127.0.0.1
          MIN_PORT: '21000'
          MAX_PORT: '21010'
        ports:
          - 52121:21
          - 21000-21010:21000-21010
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Run tests, a real-PostGIS sync and real SFTP and FTP servers among them
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: gis
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_SFTP_PORT: '52222'
          TEST_FTP_PORT: '52121'
          TEST_MYSQL_PORT: '53306'
        run: pytest
      - name: Validate the example projects
        run: for p in examples/*/; do dataops validate "$p" || exit 1; done

  # What dataops loads, served by GeoServer Cloud: loaded, published, read back through WFS and WCS,
  # reloaded under the running GeoServer and read back again (tests/test_e2e_geoserver.py)
  e2e-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer Cloud, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/geoserver-cloud/rest
          E2E_SERVICES_URL: http://localhost:59090/geoserver-cloud
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data  # mounted at /data in every GeoServer service
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: for s in rest wfs wcs gateway; do echo "== $s"; docker logs dataops-e2e-$s-1 2>&1 | grep -v accesslog | tail -100; done

  # The same against standard GeoServer
  e2e-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      # docker.osgeo.org is slow from GitHub's runners (minutes for the GeoServer image): it comes from the cache
      - name: The GeoServer image's name
        id: image
        run: |
          v=$(sed -n 's/^export STANDARD_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "name=docker.osgeo.org/geoserver:$v" >> "$GITHUB_OUTPUT"
      - name: The GeoServer image, from the cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: Load the GeoServer image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/geoserver-image.tar
      - name: Start GeoServer and PostGIS
        run: tests/e2e/up.sh standard
      - name: Keep the GeoServer image for the next run
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save "${{ steps.image.outputs.name }}" -o ~/geoserver-image.tar
      - name: Save it in the cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs dataops-e2e-geoserver-1 2>&1 | tail -200

  # The same against GeoServer 2.28, the older series still maintained
  e2e-standard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      # docker.osgeo.org is slow from GitHub's runners (minutes for the GeoServer image): it comes from the cache
      - name: The GeoServer image's name
        id: image
        run: |
          v=$(sed -n 's/^export STANDARD_2_GEOSERVER_VERSION=\([^ ]*\).*/\1/p' tests/e2e/up.sh)
          echo "name=docker.osgeo.org/geoserver:$v" >> "$GITHUB_OUTPUT"
      - name: The GeoServer image, from the cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: Load the GeoServer image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/geoserver-image.tar
      - name: Start GeoServer and PostGIS
        run: tests/e2e/up.sh standard-2
      - name: Keep the GeoServer image for the next run
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: docker save "${{ steps.image.outputs.name }}" -o ~/geoserver-image.tar
      - name: Save it in the cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/geoserver-image.tar
          key: image-${{ steps.image.outputs.name }}
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs dataops-e2e-geoserver-1 2>&1 | tail -200

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck tests/ci/*.sh tests/e2e/*.sh
      - name: Check the Kubernetes example against Kubernetes's schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.37.0 docs/kubernetes/dataops.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t dataops:ci .
      - name: Smoke test
        run: |
          docker run --rm dataops:ci --version
          docker run --rm --entrypoint ogr2ogr dataops:ci --version
          docker run --rm -v "$PWD/examples/uk-basemap:/project:ro" dataops:ci validate /project
