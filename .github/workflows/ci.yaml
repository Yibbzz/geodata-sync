name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # the versions workflow starts it on its pull request if GitHub doesn't

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: gis
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Run tests, a real-PostGIS sync among them
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: gis
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: pytest
      - name: Validate the example projects
        run: for p in examples/*/; do geodata validate "$p" || exit 1; done

  # What geodata loads, served by GeoServer Cloud: loaded, published, read back through WFS and WCS,
  # reloaded under the running GeoServer and read back again (tests/test_e2e_geoserver.py)
  e2e-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer Cloud, PostGIS and RabbitMQ
        run: tests/e2e/up.sh
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59090/geoserver-cloud/rest
          E2E_SERVICES_URL: http://localhost:59090/geoserver-cloud
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data  # mounted at /data in every GeoServer service
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: for s in rest wfs wcs gateway; do echo "== $s"; docker logs geodata-e2e-$s-1 2>&1 | grep -v accesslog | tail -100; done

  # The same against standard GeoServer
  e2e-standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer and PostGIS
        run: tests/e2e/up.sh standard
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs geodata-e2e-geoserver-1 2>&1 | tail -200

  # The same against GeoServer 2.28, the older series still maintained
  e2e-standard-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install GDAL
        run: tests/ci/install-gdal.sh
      - name: Install Python dependencies
        run: pip install -e '.[dev]'
      - name: Start GeoServer and PostGIS
        run: tests/e2e/up.sh standard-2
      - name: e2e tests
        env:
          E2E_GEOSERVER_URL: http://localhost:59091/geoserver/rest
          E2E_SERVICES_URL: http://localhost:59091/geoserver
          E2E_DB_PORT: '55433'
          E2E_DB_HOST_IN_GEOSERVER: db
          E2E_DATA_DIR: tests/e2e/data
        run: pytest -m e2e -v
      - name: Logs on failure
        if: failure()
        run: docker logs geodata-e2e-geoserver-1 2>&1 | tail -200

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        run: shellcheck tests/ci/*.sh tests/e2e/*.sh
      - name: Check the Kubernetes example against Kubernetes's schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.37.0 docs/kubernetes/geodata.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t geodata:ci .
      - name: Smoke test
        run: |
          docker run --rm geodata:ci --version
          docker run --rm --entrypoint ogr2ogr geodata:ci --version
          docker run --rm -v "$PWD/examples/uk-basemap:/project:ro" geodata:ci validate /project
